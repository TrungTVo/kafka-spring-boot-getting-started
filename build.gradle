plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id "com.github.davidmc24.gradle.plugin.avro" version "1.8.0"
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo for Kafka Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

ext {
	set('springCloudVersion', "2025.0.0")
}

repositories {
	mavenCentral()
	maven {
		url = uri('https://packages.confluent.io/maven')
    }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.apache.kafka:kafka-clients'

	// --- Spring Cloud Stream + Kafka Binder + Schema Registry ---
	implementation 'org.springframework.cloud:spring-cloud-stream'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'

	// --- Avro + Schema Registry ---
	implementation 'org.apache.avro:avro:1.11.3'
	implementation 'io.confluent:kafka-avro-serializer:7.7.0'
	implementation 'io.confluent:kafka-schema-registry-client:7.7.0'

	compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

avro {
	createSetters = true
    fieldVisibility = "PRIVATE"
}

tasks.named('generateAvroJava') {
    source = fileTree('src/main/resources/avro')
    outputDir = file("${project.buildDir}/generated-main-avro-java")
}

tasks.named('compileJava') {
    dependsOn 'generateAvroJava'
}

sourceSets {
    main {
        java {
            srcDir "${project.buildDir}/generated-main-avro-java"
        }
    }
}

tasks.named('test') {
	useJUnitPlatform()
}
